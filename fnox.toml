# ABOUTME: fnox secrets for developing vaultuner; age-encrypted values are safe to commit.
# ABOUTME: Supplies the BWS_* credentials that the Settings env fallback reads.

default_provider = "age"

[providers.age]
type = "age"
recipients = ["age1j6seutd0m7k2kwrx5udqzs7fdr76x272ysxw3dutcr2s70vvnqmq4uylrw"]

# Add secrets with `fnox set NAME`. Never paste a decrypted value into a shell
# argument; prefer stdin or the interactive prompt.
[secrets]
BWS_ACCESS_TOKEN = { provider = "age", value = "" }
BWS_ORGANIZATION_ID = { provider = "age", value = "" }
